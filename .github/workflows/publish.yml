name: Test and publish Navidrome Studio

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: navidrome-studio-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Test Studio UI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Test the UI
        working-directory: ui
        run: |
          npm ci --no-audit --no-fund
          npm run lint
          npm run type-check
          npm test -- --maxWorkers=2

  publish:
    name: Publish image to GHCR
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Image name
        id: image
        env:
          OWNER: ${{ github.repository_owner }}
        run: echo "name=ghcr.io/${OWNER,,}/navidrome-studio" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.studio
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:sha-${{ github.sha }}
          build-args: STUDIO_REVISION=${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=0.64.2-studio.1
            org.opencontainers.image.url=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=navidrome-studio
          cache-to: type=gha,mode=max,scope=navidrome-studio
      - name: Installation summary
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          DIGEST: ${{ steps.build.outputs.digest }}
          OWNER: ${{ github.repository_owner }}
        run: |
          {
            echo '## Navidrome Studio'
            echo "Published: $IMAGE:latest (linux/amd64)"
            echo "Digest: $DIGEST"
            echo "Package settings: https://github.com/users/$OWNER/packages/container/package/navidrome-studio/settings"
            echo 'Set package visibility to Public before pulling anonymously from Unraid.'
            echo 'Use container port 4533, host port 4534, a separate /data directory and read-only /music.'
          } >> "$GITHUB_STEP_SUMMARY"
